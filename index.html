<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where was this photo taken?</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #fff; --fg: #1d1d1d; --muted: #666; --line: #d9d9d4;
  --accent: #1f5bb8; --accent-bg: #eaf1fc; --warn-bg: #fbf4e2; --warn-fg: #5b4712;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 22px; margin: 0 0 12px; }
p { margin: 0 0 14px; }

.page { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.page > div { width: 100%; max-width: 36rem; }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 22px; font-weight: 600; }
.primary:disabled { background: #b8c2d2; cursor: default; }
.muted { color: var(--muted); font-size: 13px; }
.err { color: #a32020; font-size: 13px; }
.err:empty { display: none; }

.trial { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 33vw, 460px); gap: 20px; padding: 16px; }
.photo { min-height: 0; }
.photo img { width: 100%; height: 100%; object-fit: contain; object-position: top; display: block; }
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.choices { flex: 0 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 7px; padding: 4px; }
.q { font-weight: 600; margin: 0 0 2px; }
.opt { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.opt:hover { border-color: #b5b5ae; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.opt kbd { float: right; color: var(--muted); font: 12px ui-monospace, monospace; padding-top: 2px; }
.banner { font-size: 13px; line-height: 1.35; background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 10px; }
.card .head { display: flex; justify-content: space-between; font-weight: 600; }
.card .head span { font-weight: 400; color: var(--muted); font-size: 13px; }
.bar { display: block; height: 4px; background: var(--line); border-radius: 2px; margin: 4px 0 5px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.why { display: block; font-size: 12.5px; line-height: 1.38; color: #3b3b3b; }
.link { background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; align-self: flex-start; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.row .muted { flex-basis: 100%; }
.row .opt { padding: 5px 8px; font-size: 13px; }

fieldset { border: 0; padding: 0; margin: 0 0 18px; }
legend { padding: 0; margin-bottom: 8px; }
.segs { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.segs button { border: 0; border-left: 1px solid var(--line); background: none; padding: 8px 0; }
.segs button:first-child { border-left: 0; }
.segs button:focus-visible { outline-offset: -3px; }
.segs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
.free label { display: block; margin-bottom: 8px; }
.free { margin-bottom: 18px; }
textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }

@media (max-width: 800px) {
  .trial { height: auto; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; align-content: start; }
  .photo img { height: auto; max-height: 50dvh; }
  .choices { overflow: visible; }
}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This study needs JavaScript.</noscript>
<script>
"use strict";
const app = document.getElementById("app");
const q = new URLSearchParams(location.search);
const BANNER = "The AI can be wrong and sometimes describes things that aren't in the image. Check its evidence.";
let S = null;  // session state from the server: pid, session_id, countries, done, survey_done, trials
let pid = /^\d+$/.test(q.get("pid") || "") ? +q.get("pid") : null;

function h(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...kids.flat().filter(k => k != null));
  return el;
}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function page(...kids) {
  document.onkeydown = null;
  app.replaceChildren(h("main", {className: "page"}, h("div", {}, ...kids)));
  app.querySelector(".primary:not(:disabled)")?.focus();
}

const blockSize = () => S.trials.filter(t => t.block === "A").length;
const ALONE = "You choose the country on your own.";
const WITH_AI = "An AI suggests three countries with its evidence; the final choice is yours.";

function consent() {
  const err = h("p", {className: "err", role: "alert"});
  page(
    h("h1", {}, "Where was this photo taken?"),
    h("p", {}, "This is a short research study for a university course on how people use AI suggestions. " +
      "You will guess where street-level photos were taken; it takes about 10 minutes. Participation is voluntary " +
      "and anonymous: we record only your answers, response times and survey ratings, and you can stop at any time " +
      "by closing this tab. By continuing you confirm that you are 18 or older."),
    err,
    h("button", {className: "primary", textContent: "I agree", async onclick() {
      this.disabled = true;
      try {
        S = await api("/api/session", {pid});
        history.replaceState(null, "", "?pid=" + S.pid);  // a refresh now resumes this participant
        S.done ? next() : instructions();
      } catch { err.textContent = "Could not start. Please check your connection and try again."; this.disabled = false; }
    }}));
}

function instructions() {
  page(
    h("p", {}, `Pick which of ${S.countries.length} countries each photo was taken in. There are two parts of ` +
      `${blockSize()} photos: in one you decide on your own, in the other an AI suggests three countries — the final ` +
      "choice is always yours."),
    h("p", {}, "You start with one practice photo for each part. You won't be told whether you were right."),
    h("button", {className: "primary", textContent: "Start", onclick: next}));
}

// AI cards per trial, fetched once (with LIVE=1 the server runs the model, ~6 s per photo, so fetch ahead)
const AI = {};
const aiCards = t => AI[t.trial_order] ??= api(`/api/ai?pid=${S.pid}&trial_order=${t.trial_order}`)
  .catch(e => { delete AI[t.trial_order]; throw e; });
const fetchAhead = t => { if (t?.condition === "human_ai") aiCards(t).catch(() => {}); };

function next() {
  if (S.done >= S.trials.length) return S.survey_done ? thanks() : survey();
  const t = S.trials[S.done], prev = S.trials[S.done - 1];
  fetchAhead(t);
  if (prev && prev.block === t.block && prev.condition === t.condition) return trial(t);
  const what = t.condition === "human_ai" ? WITH_AI : ALONE;
  page(h("p", {}, h("strong", {}, t.is_practice ? "Practice photo (not scored). " : `Part ${t.block} · ${blockSize()} photos. `), what),
       h("button", {className: "primary", textContent: "Continue", onclick: () => trial(t)}));
}

function trial(t) {
  let sel = null, t0 = performance.now(), busy = false, expanded = false, cards = null;
  const ai = t.condition === "human_ai";
  const inBlock = S.trials.filter(x => x.block === t.block);
  const progress = t.is_practice ? "Practice · not scored" : `Part ${t.block} · ${inBlock.indexOf(t) + 1} / ${inBlock.length}`;
  const img = h("img", {src: t.image, alt: "Street-level photo to locate", onload: () => { t0 = performance.now(); }});
  const choices = h("div", {className: "choices"});
  const err = h("div", {className: "err", role: "alert"});
  const nextBtn = h("button", {className: "primary", textContent: "Next", disabled: true, onclick: submit});

  function opt(country, rank, className, ...kids) {
    return h("button", {className: "opt " + className, ariaPressed: "false", onclick() {
      sel = {country, rank};
      choices.querySelectorAll(".opt").forEach(b => { b.ariaPressed = String(b === this); });
      nextBtn.disabled = false;
    }}, ...kids);
  }
  const countryButtons = rank => S.countries.map((c, i) => opt(c, rank, "", c, ai ? null : h("kbd", {}, String(i + 1))));

  function render() {
    if (!ai) return choices.replaceChildren(h("p", {className: "q"}, "Which country was this photo taken in?"), ...countryButtons(null));
    if (!cards) return choices.replaceChildren(h("div", {className: "banner"}, BANNER), h("p", {className: "muted"}, "The AI is looking at the photo…"));
    choices.replaceChildren(
      h("div", {className: "banner"}, BANNER),
      ...cards.map(c => opt(c.country, c.rank, "card",
        h("span", {className: "head"}, c.country, h("span", {}, Math.round(c.p * 100) + "%")),
        h("span", {className: "bar"}, h("i", {style: `width:${Math.max(1, Math.round(c.p * 100))}%`})),
        h("span", {className: "why"}, c.rationale))),
      expanded ? h("div", {className: "row", role: "group", ariaLabel: "Other countries"}, h("span", {className: "muted"}, "Or choose another country:"), ...countryButtons(0))
               : h("button", {className: "link", textContent: "None of these — choose another", onclick() {
                   expanded = true; sel = null; nextBtn.disabled = true; render(); choices.querySelector(".row .opt").focus();
                 }}));
  }

  async function submit() {
    if (!sel || busy) return;
    busy = nextBtn.disabled = true;
    try {
      await api("/api/response", {pid: S.pid, trial_order: t.trial_order, trial_id: t.trial_id, response: sel.country,
        chose_rank: sel.rank, expanded_other: expanded, rt_ms: Math.min(3600000, Math.round(performance.now() - t0))});
      S.done = t.trial_order + 1;
      next();
    } catch {
      const s = await api("/api/session?pid=" + S.pid).catch(() => null);  // saved, but the reply was lost?
      if (s && s.done > t.trial_order) { S = s; return next(); }
      err.textContent = "Could not save your answer. Please check your connection and press Next again.";
      busy = nextBtn.disabled = false;
    }
  }

  render();
  app.replaceChildren(h("main", {className: "trial"},
    h("div", {className: "photo"}, img),
    h("div", {className: "side"}, h("div", {className: "muted"}, progress), choices, err, nextBtn)));
  document.onkeydown = e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key)) { document.activeElement.blur(); choices.querySelectorAll(".opt")[+e.key - 1]?.click(); }
    // Enter submits, except on a non-choice button or an unselected choice (those handle Enter natively)
    else if (e.key === "Enter" && !e.target.closest?.("button:not(.opt), .opt[aria-pressed=false]")) { e.preventDefault(); submit(); }
  };
  // the response time starts once both the photo and the AI cards are on screen
  if (ai) aiCards(t).then(c => { cards = c; t0 = performance.now(); render(); },
                          () => { err.textContent = "Could not load the AI's suggestions. Please reload the page."; });
  const after = S.trials[t.trial_order + 1];
  if (after) new Image().src = after.image;  // preload
  fetchAhead(after);
}

function survey() {
  const ans = {};
  const finish = h("button", {className: "primary", textContent: "Finish", disabled: true});
  const text = h("textarea", {rows: 3, maxLength: 5000, id: "free"});
  const err = h("p", {className: "err", role: "alert"});
  const scale = (key, label, lo, hi) => {
    const btns = [1, 2, 3, 4, 5, 6, 7].map(v => h("button", {textContent: v, ariaPressed: "false", ariaLabel: `${v} of 7`, onclick() {
      ans[key] = v;
      btns.forEach(b => { b.ariaPressed = String(b === this); });
      finish.disabled = Object.keys(ans).length < 3;
    }}));
    return h("fieldset", {}, h("legend", {}, label), h("div", {className: "segs"}, btns),
             h("div", {className: "ends", ariaHidden: "true"}, h("span", {}, lo), h("span", {}, hi)));
  };
  finish.onclick = async () => {
    finish.disabled = true;
    try {
      await api("/api/survey", {pid: S.pid, ...ans, free_text: text.value});
      S.survey_done = true;
      thanks();
    } catch {
      const s = await api("/api/session?pid=" + S.pid).catch(() => null);
      if (s?.survey_done) { S = s; return thanks(); }
      err.textContent = "Could not save. Please try again."; finish.disabled = false;
    }
  };
  page(h("h1", {}, "Almost done"),
    scale("trust", "How much did you trust the AI's suggestions?", "1 · Not at all", "7 · Completely"),
    scale("usefulness", "How useful were the AI's suggestions?", "1 · Not at all", "7 · Very useful"),
    scale("geo_knowledge", "How would you rate your own geography knowledge?", "1 · Very low", "7 · Expert"),
    h("div", {className: "free"}, h("label", {htmlFor: "free"}, "Anything else you'd like to tell us? (optional)"), text),
    err, finish);
}

function thanks() {
  page(h("h1", {}, "Thank you!"), h("p", {}, "Your answers are saved. You can close this tab now."),
       h("p", {className: "muted"}, "Completion code: " + S.session_id.slice(0, 8)));
}

(async () => {
  if (pid !== null) S = await api("/api/session?pid=" + pid).catch(() => null);
  if (!S) return consent();
  S.done ? next() : instructions();
})();
</script>
</body>
</html>
