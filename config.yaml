seed: 42

data:
  source: osv5m            # or "mapillary_custom"
  hf_repo: osv5m/osv5m
  countries: [United States, Canada, Mexico, Brazil, Argentina, Chile,
              United Kingdom, Ireland, France, Spain, Italy, Germany,
              Russia, Poland, Japan, South Korea, India, Thailand,
              South Africa, Australia]
  backup_countries: [New Zealand, Netherlands, Indonesia, Turkey]
  min_candidates: 300      # per country in the source split
  pool_per_country: 60     # candidates downloaded per country before filtering
  per_country_study: 10
  per_country_dev: 10
  text_ratio: null         # null = no text stratification (OCR finds ~0 text on OSV-5M; see
                           # iteration_log). has_text is the OCR tag, kept for analysis.
  ocr_gpu: true
  min_distance_km: 25
  min_short_side: 256
  phash_max_dist: 6
  ocr_conf: 0.5
  ocr_min_chars: 3

model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  revision: 89644892e4d85e24eaac8bacfd4f463576704203
  dtype: float16
  max_pixels: 262144                    # ~512x512
  device: auto                          # cuda > mps > cpu

inference:
  temperature: 1.0         # overwritten by --fit-temperature on dev
  shuffle_candidates: true
  explain_max_new_tokens: 60
  top_k: 3
  score_batch_size: 5
  n_orderings: 1           # >1 averages logprobs over shuffled orderings (position bias)
  baseline_max_new_tokens: 512
  prompt_versions: {rank: v1, explain: v1}

eval:
  ece_bins: 10
  bootstrap: 1000

finetune:                  # optional LoRA path (SPEC 5.6)
  per_country: 200
  exclude_km: 5
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lr: 1.0e-4
  grad_accum: 8
  dtype: bfloat16

server:
  max_upload_mb: 10
  cors_origins: ["*"]

study:
  block_size: 8            # 6 if pilots run long (SPEC 11.2)
