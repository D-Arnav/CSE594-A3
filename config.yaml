seed: 42

data:
  source: osv5m            # or "mapillary_custom"
  hf_repo: osv5m/osv5m
  source_split: train      # the test split has almost no city images (iteration_log entry 3)
  city_radius_km: 15       # keep only images this close to a listed city center
  cities:                  # [lat, lon] of major city centers per country
    United States: [[40.71, -74.01], [34.05, -118.24], [41.88, -87.63], [37.77, -122.42], [47.61, -122.33],
                    [42.36, -71.06], [29.76, -95.37], [39.95, -75.17], [38.91, -77.04], [33.75, -84.39]]
    Germany: [[52.52, 13.40], [48.14, 11.58], [53.55, 9.99], [50.11, 8.68], [50.94, 6.96], [48.78, 9.18],
              [51.23, 6.78], [51.34, 12.37], [51.05, 13.74], [52.37, 9.73]]
    Japan: [[35.68, 139.69], [34.69, 135.50], [35.18, 136.91], [35.01, 135.77], [33.59, 130.40],
            [43.06, 141.35], [34.39, 132.46], [38.27, 140.87], [35.44, 139.64], [34.69, 135.19]]
    South Korea: [[37.57, 126.98], [35.18, 129.08], [37.46, 126.71], [35.87, 128.60], [35.16, 126.85],
                  [36.35, 127.38], [35.54, 129.31], [37.26, 127.03]]
    India: [[28.61, 77.21], [19.08, 72.88], [12.97, 77.59], [13.08, 80.27], [22.57, 88.36], [17.39, 78.49],
            [18.52, 73.86], [23.02, 72.57], [26.91, 75.79], [26.85, 80.95]]
  clip_model: openai/clip-vit-base-patch32
  clip_prompts: ["a busy city street with buildings, shops and signs", "an empty road through the countryside"]
  countries: [United States, Germany, Japan, South Korea, India]   # 5 well-separated countries (iteration_log entry 3)
  backup_countries: [New Zealand, Netherlands, Indonesia, Turkey]
  min_candidates: 300      # per country in the source split
  pool_per_country: 300    # candidates downloaded per country; CLIP keeps the best study+dev
  per_country_study: 40
  per_country_dev: 40
  text_ratio: null         # null = no text stratification (OCR finds ~0 text on OSV-5M; see
                           # iteration_log). has_text is the OCR tag, kept for analysis.
  ocr_gpu: true
  min_distance_km: 1       # urban pools: avoid the same street, not the same region
  min_short_side: 256
  phash_max_dist: 6
  ocr_conf: 0.5
  ocr_min_chars: 3

model:
  model_id: HuggingFaceTB/SmolVLM2-2.2B-Instruct   # weaker fallback (SPEC 5.1); Qwen3-VL-2B got 99% top-1 (iteration_log entry 4)
  revision: 482adb537c021c86670beed01cd58990d01e72e4
  dtype: float16
  max_pixels: 262144                    # ~512x512  (Qwen processors only)
  image_splitting: false                # SmolVLM: one 384px view, no tiles (weaker + 10x faster; entry 4)
  device: auto                          # cuda > mps > cpu

inference:
  temperature: 1.0         # overwritten by --fit-temperature on dev
  shuffle_candidates: true
  explain_max_new_tokens: 60
  top_k: 3
  score_batch_size: 5
  n_orderings: 1           # >1 averages logprobs over shuffled orderings (position bias)
  baseline_max_new_tokens: 512
  prompt_versions: {rank: v1, explain: v4}   # v2 for Qwen (entry 2); v4 for SmolVLM (entry 4)

eval:
  ece_bins: 10
  bootstrap: 1000

finetune:                  # optional LoRA path (SPEC 5.6)
  per_country: 200
  exclude_km: 5
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lr: 1.0e-4
  grad_accum: 8
  dtype: bfloat16

server:
  max_upload_mb: 10
  cors_origins: ["*"]

study:
  block_size: 8            # 6 if pilots run long (SPEC 11.2)
